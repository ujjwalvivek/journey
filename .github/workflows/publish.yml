name: Publish Engine to NPM and Github Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # --------------------------------------------------------
  # JOB 1: Web Assembly & Package Registries
  # --------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Wasm Package
        working-directory: ./game
        run: wasm-pack build --target web --release

      - name: Rename & Version Package
        working-directory: ./game/pkg
        run: npm pkg set name="@ujjwalvivek/journey-engine" && npm pkg set version="${GITHUB_REF#refs/tags/v}"

      - name: Upgrade NPM for OIDC support
        run: npm install -g npm@latest

      - name: Publish to NPM
        working-directory: ./game/pkg
        run: npm publish --provenance --access public

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish to GitHub Packages
        working-directory: ./game/pkg
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------
  # JOB 2: Native Desktop Builds (Windows & Linux)
  # --------------------------------------------------------
  build-native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: journey-engine-linux.tar.gz
            bin_path: target/release/journey
          - os: windows-latest
            artifact_name: journey-engine-windows.zip
            bin_path: target\release\journey.exe
            
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Build Native Engine
        working-directory: ./game
        run: cargo build --release

      - name: Package Linux Binary & Hash
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/release journey
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Windows Exe & Hash
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ${{ matrix.bin_path }} -DestinationPath ${{ matrix.artifact_name }}
          (Get-FileHash ${{ matrix.artifact_name }} -Algorithm SHA256).Hash | Out-File -FilePath "${{ matrix.artifact_name }}.sha256" -Encoding ascii

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            game/${{ matrix.artifact_name }}
            game/${{ matrix.artifact_name }}.sha256
