<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta property="og:image" content="https://cdn.ujjwalvivek.com/posts/media/journey.webp" />
  <meta property="twitter:card" content="summary_large_image" />
  <title>Journey Engine - Crafted on Rust</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #orientation-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #orientation-warning svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: rotate 2s ease-in-out infinite;
    }

    @keyframes rotate {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    #orientation-warning h2 {
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    #orientation-warning p {
      font-size: 16px;
      opacity: 0.8;
      max-width: 300px;
    }

    /* Show warning when portrait or too narrow */
    @media (orientation: portrait), (max-width: 640px) {
      #orientation-warning {
        display: flex;
      }
      canvas {
        display: none !important;
      }
    }
  </style>
    <!-- Visitor counter -->
  <script data-goatcounter="https://rusty-journey.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <div id="orientation-warning">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="2" width="16" height="20" rx="2" />
      <path d="M12 18h.01" />
    </svg>
    <h2>Please Rotate Your Device</h2>
    <p>This game is best experienced in landscape mode with a wider screen.</p>
  </div>
  <script>
    //? Canvas resize glue for iframes and devicePixelRatio changes.
    //* winit may not detect these on its own; dispatching a resize event
    //* lets the Rust event loop pick up the new dimensions.
    new ResizeObserver(function () {
      window.dispatchEvent(new Event('resize'));
    }).observe(document.documentElement);

    //? Re-register on each DPR change
    (function watchDPR() {
      matchMedia('(resolution: ' + devicePixelRatio + 'dppx)')
        .addEventListener('change', function () {
          window.dispatchEvent(new Event('resize'));
          watchDPR();
        }, { once: true });
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
