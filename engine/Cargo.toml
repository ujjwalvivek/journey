[package]
name = "journey-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"
categories = ["game-engines", "game-development", "rendering", "wasm"]

# Default features keep 1.3 behaviour. A web scene that needs none of them can set default-features = false
# and drop egui (and its bundled fonts), kira and image from its build.
[features]
default = ["egui", "audio", "image"]
egui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
audio = ["dep:kira"]
image = ["dep:image"]

[lib]
name = "engine"
crate-type = ["rlib"]

[dependencies]
noise = "0.8"
log = "0.4"
wgpu = "27"
winit = "0.30"
egui = { version = "0.33", optional = true }
egui-wgpu = { version = "0.33", optional = true }
bytemuck = { version = "1", features = ["derive"] }
web-time = "1"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
kira = { version = "0.12", optional = true }

# Native-only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = "0.11"
egui-winit = { version = "0.33", optional = true }
pollster = "0.4"
env_logger = "0.11"

# WASM-only (arboard clipboard crate doesn't compile for wasm32)
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.33", default-features = false, optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "Node",
    "Window",
] }
