[package]
name = "game"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "Journey Engine: A custom 2D game engine built with Rust and wGPU"
repository = "https://github.com/ujjwalvivek/journey"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "journey"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
log = "0.4"
rand = "0.8"
egui = "0.33"
instant = { version = "0.1", features = ["wasm-bindgen", "inaccurate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3.72", features = ["Window", "Storage"] }
