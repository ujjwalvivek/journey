name: Publish Engine (NPM, crates.io, GitHub Packages, Docs)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  deployments: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Tag Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/versioning/go.mod

      - name: Assert Version Consistency with Tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSIONS="$(go -C tools/versioning run . -print)"
          echo "$VERSIONS"
          CARGO_VERSION="$(printf '%s\n' "$VERSIONS" | awk -F= '$1=="cargo" { print $2 }')"
          WEB_VERSION="$(printf '%s\n' "$VERSIONS" | awk -F= '$1=="web" { print $2 }')"

          if [ -z "$CARGO_VERSION" ] || [ -z "$WEB_VERSION" ]; then
            echo "Could not parse versions from tools/versioning -print output"
            exit 1
          fi

          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "Tag mismatch: tag ($TAG) != cargo ($CARGO_VERSION)"
            exit 1
          fi

          if [ "$TAG" != "$WEB_VERSION" ]; then
            echo "Tag mismatch: tag ($TAG) != web ($WEB_VERSION)"
            exit 1
          fi

          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Release Inputs
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy -p journey-engine -p journey-game -p journey-sound -p journey-sequencer -- -D warnings

      - name: Test Rust Workspace
        run: cargo test --workspace

      - name: Check Game WASM
        run: cargo check -p journey-game --target wasm32-unknown-unknown

      - name: Package Rust Crates
        run: |
          cargo package -p journey-sound
          cargo package -p journey-sequencer
          cargo package -p journey-engine

  build-wasm:
    name: Build WASM Artifacts
    runs-on: ubuntu-latest
    needs: [validate, verify]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Game WASM Package
        working-directory: ./game
        run: wasm-pack build --target web --release

      - name: Name and Version Game WASM Package
        working-directory: ./game/pkg
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          npm pkg set name="@ujjwalvivek/journey-engine"
          npm pkg set version="$VERSION"

      - name: Build Audio Tools WASM
        working-directory: ./tools/audio
        run: wasm-pack build --target web --release

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-packages
          path: |
            game/pkg
            tools/audio/pkg
          retention-days: 1

  build-native:
    name: Build Native Binary (${{ matrix.os }})
    needs: [validate, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: journey-engine-linux.tar.gz
            bin_path: target/release/journey
          - os: windows-latest
            artifact_name: journey-engine-windows.zip
            bin_path: target\release\journey.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Build Native Engine
        working-directory: ./game
        run: cargo build --release

      - name: Package Linux Binary and Hash
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/release journey
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Windows Binary and Hash
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ${{ matrix.bin_path }} -DestinationPath ${{ matrix.artifact_name }}
          (Get-FileHash ${{ matrix.artifact_name }} -Algorithm SHA256).Hash | Out-File -FilePath "${{ matrix.artifact_name }}.sha256" -Encoding ascii

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          retention-days: 1

  publish-npm:
    name: Publish WASM Package to NPM and GitHub Packages
    runs-on: ubuntu-latest
    needs: [validate, build-wasm]
    steps:
      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-packages
          path: .

      - name: Setup Node.js for NPM
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check npm Version
        run: npm --version

      - name: Publish to NPM
        working-directory: ./game/pkg
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if npm view "@ujjwalvivek/journey-engine@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@ujjwalvivek/journey-engine@$VERSION already exists on npm; skipping"
            exit 0
          fi

          npm publish --access public

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish to GitHub Packages
        working-directory: ./game/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if npm view "@ujjwalvivek/journey-engine@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@ujjwalvivek/journey-engine@$VERSION already exists on GitHub Packages; skipping"
            exit 0
          fi

          npm publish --registry=https://npm.pkg.github.com

  publish-cargo:
    name: Publish Rust Crates to crates.io
    runs-on: ubuntu-latest
    needs: [validate, verify]
    environment: crates-io
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io via Trusted Publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish Workspace Crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          publish_crate() {
            crate="$1"

            if curl -fsS "https://crates.io/api/v1/crates/${crate}/${VERSION}" >/dev/null; then
              echo "${crate} ${VERSION} already exists on crates.io; skipping"
              return
            fi

            cargo publish -p "$crate" --no-verify
          }

          publish_crate journey-sound
          publish_crate journey-sequencer
          publish_crate journey-engine

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish-npm, publish-cargo, build-native]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Native Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: journey-engine-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-artifacts/*

  deploy:
    name: Deploy Website and Docs
    runs-on: ubuntu-latest
    needs: [build-wasm, publish-npm, publish-cargo, release]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-packages
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Project
        working-directory: ./web
        run: npm run build:quick

      - name: Install mdBook
        run: |
          MDBOOK_VER=v0.4.47
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VER}/mdbook-${MDBOOK_VER}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin

      - name: Build Documentation
        run: mdbook build docs

      - name: Deploy Game to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.90.0'
          command: pages deploy web/dist --project-name=journey --branch=main
        env:
          WRANGLER_LOG: info

      - name: Deploy Docs to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.90.0'
          command: pages deploy docs/book --project-name=journey-docs --branch=main
        env:
          WRANGLER_LOG: info
