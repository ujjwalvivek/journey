name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/versioning/go.mod

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Check Version Sync
        run: go -C tools/versioning run . -check

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy -p journey-engine -p journey-game -p journey-sound -p journey-sequencer -- -D warnings

      - name: Test Rust Workspace
        run: cargo test --workspace

      - name: Check Game WASM
        run: cargo check -p journey-game --target wasm32-unknown-unknown

      - name: Package Rust Crates
        run: |
          cargo package -p journey-sound
          cargo package -p journey-sequencer
          cargo package -p journey-engine

      - name: Build Web
        working-directory: ./web
        run: npm run build

      - name: Install mdBook
        run: |
          MDBOOK_VER=v0.4.47
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VER}/mdbook-${MDBOOK_VER}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin

      - name: Build Documentation
        run: mdbook build docs
