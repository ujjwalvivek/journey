[package]
name = "journey-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"
categories = ["game-engines", "game-development", "rendering", "wasm"]

[lib]
name = "engine"
crate-type = ["rlib"]

[dependencies]
noise = "0.8"
log = "0.4"
wgpu = "27"
winit = "0.30"
egui = "0.33"
egui-wgpu = "0.33"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
kira = "0.12"

# Native-only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = "0.11"
egui-winit = "0.33"
pollster = "0.4"
env_logger = "0.11"

# WASM-only (arboard clipboard crate doesn't compile for wasm32)
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.33", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "Node",
    "Window",
] }
