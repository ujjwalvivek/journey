[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
noise = "0.8"
log = "0.4"

# Native-only: rendering + UI
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "27"
winit = "0.30"
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"

# WASM-only: JS interop + panic diagnostics
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }
