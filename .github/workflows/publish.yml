name: Publish Engine (NPM · crates.io · GitHub Packages · Docs)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  deployments: write

jobs:
  # --------------------------------------------------------
  # JOB 0: Validate Version Consistency & Release Tag
  # --------------------------------------------------------
  validate:
    name: Validate Tag Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/versioning/go.mod

      - name: Assert Version Consistency with Tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSIONS="$(go -C tools/versioning run . -print)"
          echo "$VERSIONS"
          CARGO_VERSION="$(printf '%s\n' "$VERSIONS" | awk -F= '$1=="cargo" { print $2 }')"
          WEB_VERSION="$(printf '%s\n' "$VERSIONS" | awk -F= '$1=="web" { print $2 }')"

          if [ -z "$CARGO_VERSION" ] || [ -z "$WEB_VERSION" ]; then
            echo "Could not parse versions from tools/versioning -print output"
            exit 1
          fi

          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "Tag mismatch: tag ($TAG) != cargo ($CARGO_VERSION)"
            exit 1
          fi

          if [ "$TAG" != "$WEB_VERSION" ]; then
            echo "Tag mismatch: tag ($TAG) != web ($WEB_VERSION)"
            exit 1
          fi

  # --------------------------------------------------------
  # JOB 1: Web Assembly & Package Registries
  # --------------------------------------------------------
  publish:
    name: Build & Publish WASM Package to NPM and GitHub Packages
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Wasm Package
        working-directory: ./game
        run: wasm-pack build --target web --release

      - name: Rename & Version Package
        working-directory: ./game/pkg
        run: npm pkg set name="@ujjwalvivek/journey-engine" && npm pkg set version="${GITHUB_REF#refs/tags/v}"

      - name: Upgrade NPM for OIDC support
        run: npm install -g npm@latest

      - name: Publish to NPM
        working-directory: ./game/pkg
        run: npm publish --provenance --access public

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish to GitHub Packages
        working-directory: ./game/pkg
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: game/pkg
          retention-days: 1

  # --------------------------------------------------------
  # JOB 2: Native Desktop Builds (Windows & Linux)
  # --------------------------------------------------------
  build-native:
    name: Build & Publish Native Binaries to GitHub Releases
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: journey-engine-linux.tar.gz
            bin_path: target/release/journey
          - os: windows-latest
            artifact_name: journey-engine-windows.zip
            bin_path: target\release\journey.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Build Native Engine
        working-directory: ./game
        run: cargo build --release

      - name: Package Linux Binary & Hash
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/release journey
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package Windows Exe & Hash
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ${{ matrix.bin_path }} -DestinationPath ${{ matrix.artifact_name }}
          (Get-FileHash ${{ matrix.artifact_name }} -Algorithm SHA256).Hash | Out-File -FilePath "${{ matrix.artifact_name }}.sha256" -Encoding ascii

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  # --------------------------------------------------------
  # JOB 3: Publish journey-engine to crates.io
  # --------------------------------------------------------
  publish-cargo:
    name: Publish Rust Crate to crates.io
    runs-on: ubuntu-latest
    needs: validate
    environment: crates-io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io via Trusted Publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish journey-audio to crates.io
        run: cargo publish -p journey-audio --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish journey-synthesizer to crates.io
        run: cargo publish -p journey-synthesizer --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish journey-engine to crates.io
        run: cargo publish -p journey-engine --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # --------------------------------------------------------
  # JOB 4: Cloudflare Pages Deployment (reuses WASM artifact)
  # --------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [publish]
    name: Publish WASM Package to Journey Website

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download WASM pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: game/pkg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Project
        working-directory: ./web
        run: npm run build

      - name: Install mdBook
        run: |
          MDBOOK_VER=v0.4.47
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VER}/mdbook-${MDBOOK_VER}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin

      - name: Build Documentation
        run: mdbook build docs

      - name: Deploy Game to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.90.0'
          command: pages deploy web/dist --project-name=journey --branch=main
        env:
          WRANGLER_LOG: info

      - name: Deploy Docs to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.90.0'
          command: pages deploy docs/book --project-name=journey-docs --branch=main
        env:
          WRANGLER_LOG: info
